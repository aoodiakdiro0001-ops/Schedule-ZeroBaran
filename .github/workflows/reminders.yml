# المؤلف: Baran Avisat (Baranavisat@gmail.com)
# ============================================================
# يعمل تلقائياً كل ساعة لإرسال التذكيرات وتحديث المواعيد المنتهية.
# ============================================================
name: Schedule-ZeroBaran — Reminders Cron

on:
  schedule:
    # كل ساعة (بتوقيت UTC)
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  send-reminders:
    name: إرسال التذكيرات وتحديث المواعيد
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      DEFAULT_MEETING_URL: ${{ secrets.DEFAULT_MEETING_URL }}
      TIMEZONE: ${{ secrets.TIMEZONE }}
      SESSION_DURATION_MINUTES: ${{ secrets.SESSION_DURATION_MINUTES }}
      AVAILABILITY_WINDOW_DAYS: ${{ secrets.AVAILABILITY_WINDOW_DAYS }}

    steps:
      - name: استخراج الكود
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: تثبيت المتطلبات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: تشغيل دورة التذكيرات
        run: python scripts/send_reminders.py

      - name: تنظيف المواعيد المنتهية
        run: python scripts/cleanup_appointments.py
